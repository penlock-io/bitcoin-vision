[package]
name = "bitcoin-vision-words"
version = "0.1.0"
edition = "2024"
description = "Offline handwritten BIP39 photo recognition with word geometry and decision evidence"
repository = "https://github.com/penlock-io/llscan"
license = "MIT OR Apache-2.0"
publish = false
include = ["/Cargo.toml", "/LICENSE", "/LICENSE-APACHE", "/src/**/*.rs", "/tests/artifacts.rs", "/tests/scan.rs", "/tests/public_api.rs", "/examples/scan.rs", "/examples/photos/handwritten.png", "/docs/images/*", "/models/*.onnx", "/models/*.calibration", "/models/*.txt", "/models/README.md", "/models/NOTICE", "/models/LICENSE-APACHE"]

[dependencies]
bitcoin-vision-core = { path = "../core", version = "0.1.0" }
bitcoin-vision-forms = { path = "../forms", version = "0.1.0" }
bip39 = "2.2"
bitcoin_hashes = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
imageproc = { version = "0.27", default-features = false }
# Seeds the handwriting placement of a filled word sheet.
rand = { version = "0.9", default-features = false, features = ["std_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tract-onnx = { version = "0.23", optional = true }

[dev-dependencies]
base64 = "0.22"
tempfile = "3"
rand = { version = "0.9", features = ["std_rng"] }

[features]
default = ["onnx"]
onnx = ["dep:tract-onnx", "word-extent", "bitcoin-vision-core/onnx"]
word-extent = []
scan-profile = []
extent-experiment = ["word-extent", "scan-profile"]
# The stages, public one by one, for the research harness that studies them.
# The published crate and the app never enable it.
research = []
bundled-models = ["onnx"]
# The word sheet as a PDF for printing; reading never needs it.
print = ["bitcoin-vision-forms/print"]

[[example]]
name = "scan"
required-features = ["bundled-models"]
