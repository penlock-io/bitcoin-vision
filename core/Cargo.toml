[package]
name = "bitcoin-vision-core"
version = "0.1.0"
edition = "2024"
description = "What both bitcoin-vision pipelines stand on: image admission, homography and the ONNX plan runner"
repository = "https://github.com/llfourn/bitcoin-vision"
license = "MIT OR Apache-2.0"
publish = false
include = ["/Cargo.toml", "/LICENSE", "/LICENSE-APACHE", "/src/**/*.rs"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
imageproc = { version = "0.27", default-features = false }
tract-onnx = { version = "0.23", optional = true }

[features]
default = []
onnx = ["dep:tract-onnx"]
