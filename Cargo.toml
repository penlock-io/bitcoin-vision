[package]
name = "bitcoin-vision"
version = "0.1.0"
edition = "2024"
description = "Read handwritten bitcoin data from a photo, offline: BIP39 recovery phrases and Penlock share strips"
repository = "https://github.com/llfourn/bitcoin-vision"
license = "MIT OR Apache-2.0"
publish = false
include = ["/Cargo.toml", "/Cargo.lock", "/LICENSE", "/LICENSE-APACHE", "/README.md", "/src/**/*.rs", "/tests/readme.rs", "/docs/images/*", "/docs/pipelines/*.md"]

[workspace]
members = ["core", "forms", "words", "penlock", "penlock-scan"]
exclude = ["example-android-app/rust"]

[dependencies]
bitcoin-vision-words = { path = "words", version = "0.1.0", default-features = false, optional = true }
penlock-scan = { path = "penlock-scan", version = "0.1.0", default-features = false, optional = true }

[features]
default = ["words", "penlock", "onnx"]
# The BIP39 word pipeline, as `bitcoin_vision::words`.
words = ["dep:bitcoin-vision-words"]
# The Penlock share pipeline, as `bitcoin_vision::penlock`.
penlock = ["dep:penlock-scan"]
# Model inference for whichever pipelines are on; it turns neither on.
onnx = ["bitcoin-vision-words?/onnx", "penlock-scan?/onnx"]
# PDF output for whichever pipelines' forms are on.
print = ["bitcoin-vision-words?/print", "penlock-scan?/print"]
# Each pipeline that is on embeds its own models; see each crate.
bundled-models = ["bitcoin-vision-words?/bundled-models", "penlock-scan?/bundled-models"]
word-extent = ["words", "bitcoin-vision-words/word-extent"]
scan-profile = ["words", "bitcoin-vision-words/scan-profile"]
extent-experiment = ["words", "bitcoin-vision-words/extent-experiment"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
