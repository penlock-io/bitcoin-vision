[package]
name = "penlock-scan"
version = "0.1.0"
description = "Share-card and registered-sheet support for the full Android example"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bitcoin-vision-core = { path = "../../../core" }
bitcoin-vision-forms = { path = "../../../forms" }
bitcoin_hashes = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
imageproc = { version = "0.27", default-features = false }
penlock = { path = "../penlock" }
rand = { version = "0.9", default-features = false, features = ["std_rng"] }
tract-onnx = { version = "0.23", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# The worksheets as PDFs for printing; the phone reads and never prints.
print = ["bitcoin-vision-forms/print"]
onnx = ["dep:tract-onnx", "bitcoin-vision-core/onnx"]
